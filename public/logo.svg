<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for subtle depth -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#24da65" />
      <stop offset="70%" stop-color="#1DB954" />
      <stop offset="100%" stop-color="#179443" />
    </radialGradient>

    <!-- App Icon Rounded Mask -->
    <clipPath id="squircleClip">
      <rect x="16" y="16" width="480" height="480" rx="105" ry="105" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircleClip)">
    <!-- Base Spotify Green Background -->
    <rect x="16" y="16" width="480" height="480" fill="url(#bgGlow)" />

    <!-- REPP Typographic Mark with Musical Elements -->
    <g fill="#000000" stroke="#000000">

      <!-- ==================== 'R' ==================== -->
      <!-- Triple Vertical Bar (Staff / Barlines) -->
      <line x1="56" y1="180" x2="56" y2="332" stroke-width="10" stroke-linecap="butt" />
      <line x1="72" y1="180" x2="72" y2="332" stroke-width="4.5" stroke-linecap="butt" />
      <line x1="84" y1="180" x2="84" y2="332" stroke-width="4.5" stroke-linecap="butt" />

      <!-- Upper Loop do R integrado perfeitamente ao traço -->
      <path d="M 84 190 L 132 190 C 165 190, 165 262, 132 262 L 84 262" fill="none" stroke-width="18" stroke-linecap="square" stroke-linejoin="round" />

      <!-- Perna Diagonal do R -->
      <line x1="126" y1="262" x2="168" y2="332" stroke-width="18" stroke-linecap="square" />


      <!-- ==================== 'E' ==================== -->
      <!-- Triple Vertical Bar (Matching barline spacing exactly) -->
      <line x1="190" y1="180" x2="190" y2="332" stroke-width="10" stroke-linecap="butt" />
      <line x1="206" y1="180" x2="206" y2="332" stroke-width="4.5" stroke-linecap="butt" />
      <line x1="218" y1="180" x2="218" y2="332" stroke-width="4.5" stroke-linecap="butt" />

      <!-- Horizontal Arms of 'E' -->
      <!-- Top Bar -->
      <line x1="218" y1="190" x2="278" y2="190" stroke-width="18" stroke-linecap="square" />
      <!-- Middle Bar -->
      <line x1="218" y1="256" x2="268" y2="256" stroke-width="16" stroke-linecap="square" />
      <!-- Bottom Bar -->
      <line x1="218" y1="322" x2="278" y2="322" stroke-width="18" stroke-linecap="square" />


      <!-- ==================== FIRST 'P' ==================== -->
      <!-- Triple Vertical Bar (Identical measure distance) -->
      <line x1="300" y1="180" x2="300" y2="332" stroke-width="10" stroke-linecap="butt" />
      <line x1="316" y1="180" x2="316" y2="332" stroke-width="4.5" stroke-linecap="butt" />
      <line x1="328" y1="180" x2="328" y2="332" stroke-width="4.5" stroke-linecap="butt" />

      <!-- Loop of First 'P' -->
      <path d="M 328 190 L 360 190 C 390 190, 390 262, 360 262 L 328 262" fill="none" stroke-width="18" stroke-linecap="square" stroke-linejoin="round" />


      <!-- ==================== SECOND 'P' ==================== -->
      <!-- Triple Vertical Bar (Identical measure distance) -->
      <line x1="410" y1="180" x2="410" y2="332" stroke-width="10" stroke-linecap="butt" />
      <line x1="426" y1="180" x2="426" y2="332" stroke-width="4.5" stroke-linecap="butt" />
      <line x1="438" y1="180" x2="438" y2="332" stroke-width="4.5" stroke-linecap="butt" />

      <!-- Loop of Second 'P' -->
      <path d="M 438 190 L 468 190 C 498 190, 498 262, 468 262 L 438 262" fill="none" stroke-width="18" stroke-linecap="square" stroke-linejoin="round" />

    </g>
  </g>
</svg>
